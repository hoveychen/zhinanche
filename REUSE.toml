version = 1

# Default: code is Apache-2.0, everything else original (3D models, lesson
# material, research notes, docs, parameters) is CC-BY-SA-4.0. More specific
# annotations below override these defaults (REUSE: last match wins).
# Third-party material is annotated per file at the end; its licence texts are
# in LICENSES/. See docs/licensing.md.

[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zhinanche contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = ["**/*.js", "**/*.mjs", "**/*.py", "**/*.sh", "**/*.json", "**/*.toml", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.css", ".gitignore", ".gitattributes", ".editorconfig", ".npmrc", ".github/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zhinanche contributors"
SPDX-License-Identifier = "Apache-2.0"

# Content, not code, even though it is JSON or JS.
[[annotations]]
path = ["params/**", "js/teach/lessons.js", "js/teach/lessons.en.js", "js/teach/strings.js", "js/teach/strings.en.js"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zhinanche contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# 3D models generated by blender/scripts (another part of this project).
[[annotations]]
path = ["assets/*.glb", "assets/**/*.glb"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 zhinanche contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# ---- Third-party material ----------------------------------------------------

# Vendored library, copied unchanged from npm (pnpm vendor); keeps its LICENSE.
[[annotations]]
path = "vendor/three/**"
precedence = "override"
SPDX-FileCopyrightText = "2010-2026 three.js authors"
SPDX-License-Identifier = "MIT"

# Classical Chinese texts from Wikisource (宋史 卷149, 宋書 卷18, 南齊書 卷52).
# The header lines naming the source are ours and trivial.
[[annotations]]
path = ["research/sources/songshi-149-zhinanche.txt", "research/sources/early-records.txt"]
precedence = "override"
SPDX-FileCopyrightText = "脫脫等 (宋史, 1345); 沈約 (宋書, 488); 蕭子顯 (南齊書) - public domain, via zh.wikisource.org"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# Lesson picture drawn for this project (lesson 1 step 5): no third-party material.
[[annotations]]
path = "images/lessons/sinan.svg"
precedence = "override"
SPDX-FileCopyrightText = "2026 zhinanche contributors"
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Lesson pictures: resized copies of Wikimedia Commons files, licence and
# author checked with the Commons API (imageinfo, extmetadata) on 2026-10-20.

# https://commons.wikimedia.org/wiki/File:指南車圖_(三才圖會).jpg  (PD-old)
[[annotations]]
path = "images/lessons/sancai-tuhui.jpg"
precedence = "override"
SPDX-FileCopyrightText = "王圻、王思义《三才圖會》(1609) - public domain, via Wikimedia Commons"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# https://commons.wikimedia.org/wiki/File:South-pointing_chariot_(Science_Museum_model).jpg
[[annotations]]
path = "images/lessons/science-museum-model.jpg"
precedence = "override"
SPDX-FileCopyrightText = "2008 Andy Dingley (Wikimedia Commons)"
SPDX-License-Identifier = "CC-BY-3.0"

# https://commons.wikimedia.org/wiki/File:Gears_of_South-pointing_chariot_Model_in_National_Museum_of_Natural_Science,_Taiwan.JPG
# (dual GFDL / CC BY-SA 3.0 on Commons; we use it under CC BY-SA 3.0)
[[annotations]]
path = "images/lessons/taiwan-museum-gears.jpg"
precedence = "override"
SPDX-FileCopyrightText = "2014 SSR2000 (Wikimedia Commons)"
SPDX-License-Identifier = "CC-BY-SA-3.0"

# Photographed sky and surface scans from Poly Haven (CC0), downloaded, cut down
# and recompressed by tools/assets/build_photo.py (sources: tools/assets/sources.json).
#   kloofendal_48d_partly_cloudy_puresky - Greg Zaal, Jarod Guest
#   large_grey_tiles - Rob Tuytel
#   red_plaster_weathered, clay_roof_tiles_02 - Amal Kumar
#   dark_wood - Dimitrios Savva, Dario Barresi, Rico Cilliers
[[annotations]]
path = ["assets/photo/*.webp"]
precedence = "override"
SPDX-FileCopyrightText = "Poly Haven (polyhaven.com): Greg Zaal, Jarod Guest, Rob Tuytel, Amal Kumar, Dimitrios Savva, Dario Barresi, Rico Cilliers"
SPDX-License-Identifier = "CC0-1.0"

# Baked by tools/assets/build_photo.py from this project's own height fields
# (the palace tile rows, the bracket sets), with the Poly Haven scans above
# (clay_roof_tiles_02, red_plaster_weathered - Amal Kumar) only as grain.
[[annotations]]
path = ["assets/photo/roof-*.webp", "assets/photo/dougong-*.webp"]
precedence = "override"
SPDX-FileCopyrightText = ["2026 zhinanche contributors", "Poly Haven (polyhaven.com): Amal Kumar"]
SPDX-License-Identifier = "CC-BY-SA-4.0"

# Icons: Tabler Icons (outline set), copied by tools/vendor.mjs (pnpm vendor)
# from the npm package @tabler/icons; keeps its LICENSE.
[[annotations]]
path = "vendor/tabler-icons/**"
precedence = "override"
SPDX-FileCopyrightText = "2020-2026 Paweł Kuna (Tabler Icons)"
SPDX-License-Identifier = "MIT"
